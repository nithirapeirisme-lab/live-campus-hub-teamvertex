spring.application.name=Campus Hub
server.port = 8081
server.servlet.context-path= /live-campus-hub

#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Updated Aiven Connection Settings
spring.datasource.url=jdbc:mysql://vertex-db-vertexdb.f.aivencloud.com:26589/myprojectdb?useSSL=true&trustCertificateKeyStoreUrl=file:/path/to/ca.pem
spring.datasource.username=BackendDev
spring.datasource.password=${AIVEN_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Google Gemini Configuration
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.1-flash-lite
# Force the stable API version
spring.ai.google.genai.base-url=https://generativelanguage.googleapis.com/v1beta

spring.cloud.gcp.credentials.location=classpath:gcp-key.json

# Disable AI observations that cause "Failed to generate content"
spring.ai.chat.observations.enabled=false
management.observations.enabled=false

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jackson.property-naming-strategy=SNAKE_CASE

