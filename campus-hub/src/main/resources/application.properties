spring.application.name=Campus Hub
server.port = 8081
server.servlet.context-path= /live-campus-hub

#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Updated Aiven Connection Settings
spring.datasource.url=jdbc:mysql://vertex-db-vertexdb.f.aivencloud.com:26589/myprojectdb?useSSL=true&trustCertificateKeyStoreUrl=file:/path/to/ca.pem
spring.datasource.username=BackendDev
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

