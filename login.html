<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEC HUB | Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: linear-gradient(135deg, #003152 0%, #00aeeF 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;">

<div id="toast" class="toast"></div>

<div class="card" style="width: 100%; max-width: 420px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
    <h2 style="color: var(--cinec-navy); text-align: center; margin-bottom: 25px;">Sign In to Campus Hub</h2>
    
    <div class="form-group">
        <label style="font-weight: bold; font-size: 0.9rem;">Student / Staff ID</label>
        <input type="text" id="login-id" class="form-input" placeholder="e.g., STU_001 or STF_001">
    </div>
    
    <div class="form-group">
        <label style="font-weight: bold; font-size: 0.9rem;">Password</label>
        <input type="password" id="login-pass" class="form-input" placeholder="••••••••">
    </div>
    
    <button class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;" onclick="loginProcess()">Secure Login</button>
    
    <div style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
        <span style="color: var(--text-muted);">Don't have an account? </span>
        <a href="signup.html" style="color: var(--cinec-sky); font-weight: bold; text-decoration: none;">Register here</a>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
